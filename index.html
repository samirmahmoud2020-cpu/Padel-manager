<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Padel Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f6f9;color:#1d2733}
header{background:#173f63;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:24px}.wrap{max-width:1400px;margin:auto;padding:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{border:0;padding:11px 18px;border-radius:8px;background:#dfe8f0;cursor:pointer;font-weight:bold}.tabs button.active{background:#173f63;color:#fff}
.panel{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px #0000000c;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{padding:16px;border-radius:10px;background:#eef4f8}.card b{font-size:24px;display:block;margin-top:7px}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form label{font-weight:bold;font-size:13px}.form input,.form select{width:100%;padding:9px;border:1px solid #ccd6df;border-radius:7px;margin-top:4px}.full{grid-column:1/-1}
button.primary{background:#1b6ca8;color:white;border:0;border-radius:7px;padding:10px 18px;cursor:pointer;font-weight:bold}.danger{background:#d9534f!important}
table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:9px;border-bottom:1px solid #e4e9ee;text-align:right}
.hourgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{padding:14px;border-radius:8px;border:1px solid #d8e0e7;cursor:pointer}.hidden{display:none!important}
#loginScreen {position:fixed;inset:0;background:#173f63;display:flex;align-items:center;justify-content:center;z-index:9999;}
.login-box {background:#fff;padding:30px;border-radius:12px;width:90%;max-width:350px;text-align:center;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h2>🔒 Padel Manager</h2>
    <input type="password" id="passInput" style="width:100%;padding:10px;margin:10px 0" placeholder="أدخل كلمة المرور">
    <button class="primary" style="width:100%" onclick="checkLogin()">دخول</button>
  </div>
</div>

<div id="mainApp" class="hidden">
<header><h1>🏟️ Padel Manager</h1><button onclick="logout()">خروج</button></header>
<div class="wrap">
<div class="tabs">
<button class="active" onclick="showTab('dashboard',this)">الرئيسية</button>
<button onclick="showTab('bookings',this)">الحجوزات</button>
</div>
<section id="dashboard" class="tab"><div class="panel"><h3>جدول اليوم</h3><div id="slots" class="hourgrid"></div></div></section>
<section id="bookings" class="tab hidden"><div class="panel"><table><thead><tr><th>التاريخ</th><th>الوقت</th><th>العميل</th></tr></thead><tbody id="bookingRows"></tbody></table></div></section>
</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyuGrOGVMHU6XVLtqbAokNo3S7CUFS0TeH9oLoUFRYbo04GwQfowv0_1fHcpCM7tUWI/exec";
const ADMIN_PASS = "Padelna@2026"; // 🔐 غير الباسورد هنا

const $=id=>document.getElementById(id);

function checkLogin() {
  if ($('passInput').value === ADMIN_PASS) {
    localStorage.setItem('auth_key', btoa(ADMIN_PASS));
    location.reload();
  } else { alert('كلمة مرور خاطئة'); }
}

function logout() {
  localStorage.removeItem('auth_key');
  location.reload();
}

window.onload = () => {
  const key = localStorage.getItem('auth_key');
  if (key && atob(key) === ADMIN_PASS) {
    $('loginScreen').classList.add('hidden');
    $('mainApp').classList.remove('hidden');
    init();
  }
};

let db = {bookings:[]};

async function init() {
  try {
    const res = await fetch(SCRIPT_URL);
    db = await res.json();
    renderAll();
  } catch(e) { console.error(e); }
}

function renderAll() {
  const slotsDiv = $('slots');
  slotsDiv.innerHTML = '';
  for(let h=8; h<=23; h++) {
    slotsDiv.innerHTML += `<div class="slot"><strong>${h}:00</strong></div>`;
  }
  const rows = $('bookingRows');
  rows.innerHTML = db.bookings.map(b => `<tr><td>${b.date}</td><td>${b.start}</td><td>${b.customerId}</td></tr>`).join('');
}

function showTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.add('hidden'));
  $(id).classList.remove('hidden');
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
</body>
</html>
