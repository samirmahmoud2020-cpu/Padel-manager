<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Padel Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,sans-serif;background:#f3f6f9;color:#1d2733}
header{background:#173f63;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:24px}.wrap{max-width:1400px;margin:auto;padding:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{border:0;padding:11px 18px;border-radius:8px;background:#dfe8f0;cursor:pointer;font-weight:bold}.tabs button.active{background:#173f63;color:#fff}
.panel{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px #0000000c;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{padding:16px;border-radius:10px;background:#eef4f8}.card b{font-size:24px;display:block;margin-top:7px}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form label{font-weight:bold;font-size:13px}.form input,.form select,.form textarea{width:100%;padding:9px;border:1px solid #ccd6df;border-radius:7px;margin-top:4px}.form textarea{min-height:60px}.full{grid-column:1/-1}
button.primary{background:#1b6ca8;color:white;border:0;border-radius:7px;padding:10px 18px;cursor:pointer;font-weight:bold}.danger{background:#d9534f!important}.muted{color:#687785}
table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:9px;border-bottom:1px solid #e4e9ee;text-align:right}th{background:#edf3f7}
.badge{padding:5px 9px;border-radius:15px;font-weight:bold;font-size:12px}.confirmed{background:#b7e7a4;color:#1b4d13}.deposit{background:#ffe08a;color:#5a4300}.done{background:#a9ccef;color:#0b3b60}.cancel{background:#ffaaa5;color:#610b07}.maintenance{background:#d6d8db;color:#383d41}
.avail{background:#e9f7e8}.booked{background:#d9ebff}.main-slot{background:#e2e3e5!important}
.hourgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{padding:14px;border-radius:8px;border:1px solid #d8e0e7;cursor:pointer}.slot strong{display:block}.slot small{display:block;margin-top:5px}
.hidden{display:none!important}.actions{display:flex;gap:7px;flex-wrap:wrap}
#loginScreen{position:fixed;inset:0;background:#173f63;display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:#fff;padding:30px;border-radius:12px;width:90%;max-width:350px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.2)}
.login-box input{width:100%;padding:12px;margin:15px 0;border:1px solid #ccc;border-radius:7px;text-align:center;font-size:18px}
.login-box button{width:100%;font-size:16px}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h2>🔒 Padel Manager</h2>
    <p class="muted">أدخل كلمة المرور للمتابعة</p>
    <input type="password" id="passInput" placeholder="كلمة المرور..." onkeypress="if(event.key==='Enter') checkLogin()">
    <button class="primary" onclick="checkLogin()">دخول</button>
  </div>
</div>

<div id="mainApp" class="hidden">
<header>
  <h1>🏟️ Padel Manager</h1>
  <div><button onclick="logout()" style="background:transparent;color:#fff;border:1px solid #fff;border-radius:5px;cursor:pointer;padding:5px 10px;">خروج</button></div>
</header>
<div class="wrap">
<div class="tabs">
<button class="active" onclick="showTab('dashboard',this)">الرئيسية</button>
<button onclick="showTab('bookings',this)">الحجوزات</button>
<button onclick="backup()">نسخة احتياطية</button>
</div>
<section id="dashboard" class="tab">
<div class="panel"><h3>جدول اليوم</h3><div id="slots" class="hourgrid"></div></div>
</section>
<section id="bookings" class="tab hidden">
<div class="panel"><table><thead><tr><th>التاريخ</th><th>الوقت</th><th>العميل</th></tr></thead><tbody id="bookingRows"></tbody></table></div>
</section>
</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyuGrOGVMHU6XVLtqbAokNo3S7CUFS0TeH9oLoUFRYbo04GwQfowv0_1fHcpCM7tUWI/exec";
const ADMIN_PASS = "Padel@2026"; 
const AUTH_KEY = "padel_auth_v5";

const $=id=>document.getElementById(id);

window.onload = () => {
  if (localStorage.getItem(AUTH_KEY) === ADMIN_PASS) {
    startApp();
  } else {
    logout();
  }
};

function checkLogin() {
  if ($('passInput').value === ADMIN_PASS) {
    localStorage.setItem(AUTH_KEY, ADMIN_PASS);
    startApp();
  } else {
    alert('كلمة المرور غير صحيحة');
    $('passInput').value = '';
  }
}

function logout() {
  localStorage.removeItem(AUTH_KEY);
  $('loginScreen').classList.remove('hidden');
  $('mainApp').classList.add('hidden');
}

function startApp() {
  $('loginScreen').classList.add('hidden');
  $('mainApp').classList.remove('hidden');
  loadData();
}

let db = {customers:[], bookings:[], expenses:[]};
async function loadData() {
  try {
    const res = await fetch(SCRIPT_URL);
    const json = await res.json();
    if(json && json.bookings) db = json;
  } catch(e){}
  renderDashboard();
}

function showTab(id,btn){
  document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));
  $(id).classList.remove('hidden');
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
}

function renderDashboard(){
  let html='';
  for(let h=8;h<=23;h++){
    html+=`<div class="slot avail"><strong>${String(h).padStart(2,'0')}:00</strong><small>متاح</small></div>`;
  }
  $('slots').innerHTML=html;
}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup.json';a.click()}
</script>
</body>
</html>
