<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Padel Manager — نظام مؤمن</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f6f9;color:#1d2733}
header{background:#173f63;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:24px}.wrap{max-width:1400px;margin:auto;padding:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{border:0;padding:11px 18px;border-radius:8px;background:#dfe8f0;cursor:pointer;font-weight:bold}.tabs button.active{background:#173f63;color:#fff}
.panel{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px #0000000c;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{padding:16px;border-radius:10px;background:#eef4f8}.card b{font-size:24px;display:block;margin-top:7px}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form label{font-weight:bold;font-size:13px}.form input,.form select,.form textarea{width:100%;padding:9px;border:1px solid #ccd6df;border-radius:7px;margin-top:4px}.form textarea{min-height:60px}.full{grid-column:1/-1}
button.primary{background:#1b6ca8;color:white;border:0;border-radius:7px;padding:10px 18px;cursor:pointer;font-weight:bold}.danger{background:#d9534f!important}.muted{color:#687785}
table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:9px;border-bottom:1px solid #e4e9ee;text-align:right}th{background:#edf3f7}
.badge{padding:5px 9px;border-radius:15px;font-weight:bold;font-size:12px}.confirmed{background:#b7e7a4}.deposit{background:#ffe08a}.done{background:#a9ccef}.cancel{background:#ffaaa5}
.avail{background:#e9f7e8}.booked{background:#d9ebff}
.hourgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{padding:14px;border-radius:8px;border:1px solid #d8e0e7;cursor:pointer}.slot strong{display:block}.slot small{display:block;margin-top:5px}.slot.avail:hover{background:#d9f0d5}
.hidden{display:none!important}.actions{display:flex;gap:7px;flex-wrap:wrap}
#loginScreen {position:fixed;inset:0;background:#173f63;display:flex;align-items:center;justify-content:center;z-index:9999;}
.login-box {background:#fff;padding:30px;border-radius:12px;width:90%;max-width:350px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.2);}
.login-box input {width:100%;padding:12px;margin:15px 0;border:1px solid #ccc;border-radius:7px;text-align:center;font-size:18px;}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.hourgrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h2>🔒 Padel Manager</h2>
    <input type="password" id="passInput" placeholder="أدخل كلمة المرور..." onkeypress="if(event.key==='Enter') checkLogin()">
    <button class="primary" style="width:100%" onclick="checkLogin()">دخول</button>
  </div>
</div>

<div id="mainApp" class="hidden">
<header>
  <h1>🏟️ Padel Manager</h1>
  <button onclick="logout()" style="background:transparent;color:#fff;border:1px solid #fff;border-radius:5px;cursor:pointer;padding:5px 10px;">خروج</button>
</header>
<div class="wrap">
<div class="tabs">
<button class="active" onclick="showTab('dashboard',this)">الرئيسية</button>
<button onclick="showTab('bookings',this)">الحجوزات</button>
<button onclick="showTab('customers',this)">العملاء</button>
<button onclick="showTab('expenses',this)">المصروفات</button>
<button onclick="showTab('reports',this)">التقارير</button>
</div>
<section id="dashboard" class="tab"><div class="panel"><div class="actions"><label>التاريخ <input id="dashDate" type="date" onchange="renderAll()"></label><button class="primary" onclick="newBooking()">+ حجز</button></div></div><div class="cards"><div class="card">حجوزات اليوم<b id="dCount">0</b></div><div class="card">ساعات اللعب<b id="dHours">0</b></div><div class="card">إجمالي الحجوزات<b id="dRevenue">0</b></div><div class="card">المحصل<b id="dPaid">0</b></div><div class="card">المتبقي<b id="dDue">0</b></div></div><div class="panel"><h3>جدول اليوم</h3><div id="slots" class="hourgrid"></div></div></section>
<section id="bookings" class="tab hidden"><div class="panel"><table><thead><tr><th>التاريخ</th><th>الوقت</th><th>العميل</th><th>الإجمالي</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="bookingRows"></tbody></table></div></section>
<section id="customers" class="tab hidden"><div class="panel"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>إجراءات</th></tr></thead><tbody id="customerRows"></tbody></table></div></section>
<section id="expenses" class="tab hidden"><div class="panel"><h3>تسجيل مصروف</h3><div class="form"><input id="eDate" type="date"><input id="eItem" placeholder="البند"><input id="eAmount" type="number" placeholder="القيمة"><button class="primary" onclick="saveExpense()">حفظ</button></div></div><table><thead><tr><th>التاريخ</th><th>البند</th><th>القيمة</th><th>إجراء</th></tr></thead><tbody id="expenseRows"></tbody></table></section>
<section id="reports" class="tab hidden"><div class="panel"><h3>التقرير</h3><div id="reportCards" class="cards"></div></div></section>
</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyuGrOGVMHU6XVLtqbAokNo3S7CUFS0TeH9oLoUFRYbo04GwQfowv0_1fHcpCM7tUWI/exec";
const ADMIN_PASS = "Padelna@2026"; // 🔐 غير الباسورد هنا

const $=id=>document.getElementById(id);

function checkLogin() {
  if ($('passInput').value === ADMIN_PASS) {
    localStorage.setItem('auth_key', btoa(ADMIN_PASS));
    location.reload();
  } else { alert('كلمة مرور خاطئة'); }
}

function logout() {
  localStorage.removeItem('auth_key');
  location.reload();
}

window.onload = () => {
  const key = localStorage.getItem('auth_key');
  if (key && atob(key) === ADMIN_PASS) {
    $('loginScreen').classList.add('hidden');
    $('mainApp').classList.remove('hidden');
    init();
  }
};

// ... باقي وظائف البرنامج (init, loadData, renderAll... إلخ) تضعها هنا ...
// (يتم استدعاء init عند نجاح الدخول فقط)
async function init(){ /* كود تحميل البيانات */ }
function showTab(id,btn){ /* تبديل التابات */ }
// ... (قم بنسخ الدوال الموجودة في الكود السابق هنا)
</script>
</body>
</html>
